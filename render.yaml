services:
  - type: web
    name: btc-hybrid-predictor
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 120
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: btc-predictor-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.11.9"
    disk:
      name: predictor-models
      mountPath: /opt/render/project/src/models
      sizeGB: 1

databases:
  - name: btc-predictor-db
    plan: free
