services:
  - type: web
    name: btc-hybrid-predictor
    runtime: python
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python start.py
    healthCheckPath: /health
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: btc-predictor-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.11.10"
      - key: POLL_SECONDS
        value: "20"
    disk:
      name: predictor-models
      mountPath: /opt/render/project/src/models
      sizeGB: 1

databases:
  - name: btc-predictor-db
    plan: free
